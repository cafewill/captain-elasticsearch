services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=Demo3543##
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-9330-data:/usr/share/elasticsearch/data
    networks:
      - elasticsearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"elastic:Demo3543##\" http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=Demo3543##
    ports:
      - "5601:5601"
    networks:
      - elasticsearch-net
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-9330-data:

networks:
  elasticsearch-net:
    driver: bridge
