spring.application.name=my-app
spring.profiles.active=local

# Elasticsearch 연결
elasticsearch.url=https://localhost:9200
elasticsearch.index=logs-${spring.application.name}-{date}

# SSL (내부망 자가 서명 인증서)
elasticsearch.trust-all-ssl=true

# Writer thread
# false: logback-elasticsearch 호환 방식. 이벤트 발생 시 writer thread 기동, idle 시 종료
# true: daemon writer thread 1개를 appender 생명주기 동안 유지
elasticsearch.persistent-writer-thread=true

# Retry / requeue
elasticsearch.max-retries=3
elasticsearch.requeue-on-failure=true

# 타임스탬프 기준 타임존: Asia/Seoul
# timestampFormat 을 사용하는 경우 logback-spring.xml 에서 설정
