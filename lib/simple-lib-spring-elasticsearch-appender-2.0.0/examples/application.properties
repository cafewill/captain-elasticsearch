# Legacy properties remain valid.
cube.elasticsearch.web.enabled=true
cube.elasticsearch.job.enabled=true

# Existing/legacy appender parameters can still be supplied in logback-spring.xml via ${...} placeholders.
elasticsearch.url=http://localhost:9200
elasticsearch.index=app-logs-{date}
elasticsearch.username=
elasticsearch.password=
elasticsearch.app=my-service
elasticsearch.env=local
elasticsearch.instance-id=
elasticsearch.max-batch-bytes=262144
elasticsearch.max-batch-size=200
elasticsearch.max-message-size=32768
elasticsearch.flush-interval-seconds=3
elasticsearch.queue-size=10000
elasticsearch.connect-timeout-millis=3000
elasticsearch.read-timeout-millis=5000
elasticsearch.retry-initial-delay-millis=500
elasticsearch.retry-max-delay-millis=10000
elasticsearch.max-retries=3
elasticsearch.retry-partial-failures=true
elasticsearch.trust-all-ssl=true
elasticsearch.dead-letter-logger-name=com.cube.elasticsearch.deadletter
elasticsearch.operation=create
elasticsearch.include-kvp=true
elasticsearch.errors-to-stderr=true

# Added in 1.2.0. Optional. If omitted, defaults to UTC.
elasticsearch.timestamp-zone=Asia/Seoul
# Added in 1.2.0. Optional. Default true.
elasticsearch.include-mdc=true
